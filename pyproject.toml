[project]
name = "devprompt-ai"
version = "0.3.0"
description = "DevPrompt AI - 把模糊自然语言需求编译为工程级精准提示词"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "openai-agents>=0.23.1,<1.0",
    # MCP 双向（2026-11-21）：openai-agents 已带客户端（agents.mcp），这里显式声明
    # 服务端所用 SDK，防止它作为传递依赖被上游悄悄改版本。
    "mcp>=2.3,<3",
    # Reflection 适配器（2026-11-22）：httpx 本就是 openai 的传递依赖（uv.lock 0.28.1），
    # 显式声明只为不让上游改动悄悄换掉我们的调用面；不新增实际安装包。
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28",
    # 桌面端 sidecar 打包（构建期工具，非运行时依赖）；版本经 PyPI 核实（MUST-24b）
    "pyinstaller>=6.22.3,<7",
]
# 原生协议适配（2026-09-17 多供应商扩展）：仅在使用 Anthropic / Gemini 原生
# api_mode 时才需要。MUST-04 论证：这两个 SDK 的请求结构、鉴权方式、流式事件形状
# 与 OpenAI 不兼容，无法用项目内已有封装覆盖；唯一 1–2 级替代是手写 HTTP 客户端，
# 等于重复实现其鉴权重试/流式解析/错误映射，成本与风险均高于直接依赖。
# 版本经 PyPI 核实（MUST-24b）：anthropic 1.15.0、google-genai 2.31.0，均要求 Python>=3.10。
anthropic = ["anthropic>=1.15,<2"]
gemini = ["google-genai>=2.31,<3"]

# console script：默认动作即启动本地服务（`devprompt-ai --help` 查看全部参数）
[project.scripts]
devprompt-ai = "devprompt_ai.main:main"
# native messaging host（2026-10-19）：浏览器扩展拉起此脚本弹系统原生文件夹选择器（stdio 长度前缀协议）
devprompt-ai-pick-folder = "devprompt_ai.native_host:main"
# 桌面端 sidecar（2026-10-22）：Electron 桌面壳 spawn 的子进程，随机端口 + stdout 就绪协议
devprompt-ai-desktop = "devprompt_ai.desktop:main"
# MCP 交付形态（2026-11-21）：stdio 给本地客户端；--transport streamable-http 供远程。
devprompt-ai-mcp = "devprompt_ai.interfaces.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devprompt_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff 0.16 起默认格式化 Markdown 内嵌 Python 代码块，会改写范围外文档（AGENTS.md、架构文档等），
# 显式排除以保持文档原样并保证 format --check 稳定绿灯（偏差说明见阶段二实施记录）；
# eval/ 为召回率实测的语料 fixture（mock 仓库样例代码），属数据而非项目代码，同样排除
extend-exclude = ["*.md", "eval"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src", "tests"]
explicit_package_bases = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["agents.*", "openai.*"]
ignore_missing_imports = true

# 可选 extras（anthropic / gemini）：CI 与默认安装均不装这两个 SDK，
# 故按「缺失」处理而不让门禁变红——与上方 agents/openai 同一惯例。
[[tool.mypy.overrides]]
module = ["google.*", "anthropic.*"]
ignore_missing_imports = true

# 测试与脚本：大量用 SimpleNamespace / mock 构造对象来驱动被测路径，
# 并大量携带仅为压制历史告警的 type: ignore。这些码在测试语境下没有判定价值，
# 关掉它们让门禁聚焦真实契约；生产代码 src/ 仍是全量 strict，不受影响。
# 模块名须完全限定（mypy 只允许 '*' 作为整组件），故逐个列出。
[[tool.mypy.overrides]]
module = [
    "conftest",
    "helpers",
    "e2e.*",
    "e2e.*.*",
    "harness.*",
    "scripts.*",
    "decision.*",
    "decision.*.*",
    "domain.*",
    "domain.*.*",
    "memory.*",
    "memory.*.*",
    "obs_e2e",
    "probe_llm_output_shape",
    "smoke_real_llm",
    "smoke_reply",
    "test_adapters",
    "test_agent_loop",
    "test_cost_monitoring",
    "test_facts",
    "test_fallback",
    "test_flow_recovery",
    "test_live_endpoints",
    "test_live_real_llm",
    "test_llm_routing",
    "test_llm_streaming",
    "test_llm_usage",
    "test_locate",
    "test_loop_hardening",
    "test_mcp_manager",
    "test_mcp_server",
    "test_memory_injection",
    "test_meridian",
    "test_obs_cross_module",
    "test_obs_metrics",
    "test_obs_performance",
    "test_obs_real_llm",
    "test_obs_replay",
    "test_obs_resilience",
    "test_obs_session_log",
    "test_obs_trace",
    "test_p1_resume",
    "test_p2_cache_rewrite",
    "test_p3_cleanup",
    "test_replay_compare",
    "test_runner",
    "test_skill_loader",
    "test_smoke_provider_contract",
    "test_startup_orphans",
    "test_subagents",
    "test_trace_store",
    "test_trace_tree",
    "test_visual_domain",
]
disable_error_code = [
    "attr-defined",
    "arg-type",
    "unused-ignore",
    "import-not-found",
    "index",
    "no-any-return",
    "no-untyped-def",
    "typeddict-item",
    "misc",
    "type-arg",
    "union-attr",
    "call-arg",
    "assignment",
    "var-annotated",
    "has-type",
    "truthy-bool",
    "redundant-expr",
    "list-item",
    "dict-item",
    "return-value",
    "name-defined",
    "operator",
    "func-returns-value",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: 端到端集成测试（可独立运行，默认包含确定性用例）",
    "real_llm: 需要真实大模型配置的用例（默认 skip，需 OBS_E2E_REAL_LLM=1）",
    "perf: 性能门槛用例（采集/查询延迟与完整率）",
]
