[project]
name = "devprompt-ai"
version = "0.1.0"
description = "DevPrompt AI - 把模糊自然语言需求编译为工程级精准提示词"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "openai-agents>=0.23.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28",
]

# console script：默认动作即启动本地服务（`devprompt-ai --help` 查看全部参数）
[project.scripts]
devprompt-ai = "devprompt_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devprompt_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff 0.16 起默认格式化 Markdown 内嵌 Python 代码块，会改写范围外文档（AGENTS.md、架构文档等），
# 显式排除以保持文档原样并保证 format --check 稳定绿灯（偏差说明见阶段二实施记录）；
# eval/ 为召回率实测的语料 fixture（mock 仓库样例代码），属数据而非项目代码，同样排除
extend-exclude = ["*.md", "eval"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["agents.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
