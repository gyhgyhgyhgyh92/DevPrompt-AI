[project]
name = "devprompt-ai"
version = "0.1.0"
description = "DevPrompt AI - 把模糊自然语言需求编译为工程级精准提示词"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "typer>=0.15,<0.16",
    "rich>=13,<14",
    "openai-agents>=0.23.1,<1.0",
    "aiomysql>=0.3.2,<1.0",
    "PyMySQL>=1.2.0,<2",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.2,<1.0"]
dev = [
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[project.scripts]
devprompt = "devprompt_ai.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devprompt_ai"]
